name: APP-004 Validate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript
        shell: bash
        run: node --input-type=module --check < app.js

      - name: Validate static site files
        shell: bash
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s assets/fallback.svg
          grep -q 'app-root' index.html
          grep -q 'SUPABASE_PUBLISHABLE_KEY' app.js
